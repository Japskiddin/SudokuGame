config:
  validation: true
  warningsAsErrors: true

complexity:
  LongParameterList:
    allowedFunctionParameters: 11
    ignoreDefaultParameters: true
  TooManyFunctions:
    excludes: &testSources ['**/test/**', '**/androidTest/**', '**/androidDeviceTest/**', '**/androidHostTest/**', '**/commonTest/**', '**/jvmTest/**', '**/androidUnitTest/**', '**/androidInstrumentedTest/**', '**/jsTest/**', '**/iosTest/**']
    ignoreAnnotatedFunctions: ['Preview', 'PreviewSudoku']

exceptions:
  InstanceOfCheckForException:
    excludes: *testSources
  ThrowingExceptionsWithoutMessageOrCause:
    excludes: *testSources
  TooGenericExceptionCaught:
    excludes: *testSources

naming:
  FunctionNaming:
    excludes: *testSources
    ignoreAnnotated: ['Composable']
  TopLevelPropertyNaming:
    constantPattern: '[A-Z][A-Za-z0-9]*'

performance:
  ForEachOnRange:
    excludes: *testSources
  SpreadOperator:
    excludes: *testSources

potential-bugs:
  UnsafeCallOnNullableType:
    excludes: *testSources

style:
  ForbiddenComment:
    active: false
  MagicNumber:
    excludes: ['**/test/**', '**/androidTest/**', '**/androidDeviceTest/**', '**/androidHostTest/**', '**/commonTest/**', '**/jvmTest/**', '**/androidUnitTest/**', '**/androidInstrumentedTest/**', '**/jsTest/**', '**/iosTest/**', '**/*.kts']
  UnusedPrivateFunction:
    ignoreAnnotated: ['Preview', 'PreviewSudoku']

ktlint:
  active: true
  code_style: 'intellij_idea'
  autoCorrect: false
  # Match the formatting conventions already set in .editorconfig.
  ClassSignature:
    active: false
  FunctionExpressionBody:
    active: false
  FunctionSignature:
    active: false
  PropertyName:
    active: false
  TrailingCommaOnCallSite:
    active: false
  TrailingCommaOnDeclarationSite:
    active: false
